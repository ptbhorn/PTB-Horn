<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#161514">
  <title>PTB Horn — Private Editor</title>
  <style>
    @font-face { font-family:"VCR OSD Mono"; src:url("assets/VCR_OSD_MONO_1.001.ttf") format("truetype"); font-display:swap; }
    @font-face { font-family:"Grishenko NBP"; src:url("assets/GrishenkoNbpRegular-eqPn.ttf?v=2") format("truetype"); font-style:normal; font-weight:400; font-display:block; }
    :root { color:#f1ede3; background:#161514; font-family:"VCR OSD Mono",monospace; }
    * { box-sizing:border-box; }
    body { max-width:860px; min-height:100vh; margin:0 auto; padding:36px 24px 64px; background:#161514; color:#f1ede3; font-size:16px; line-height:1.45; }
    a,button { color:#f1ede3; } header { display:flex; flex-direction:column; align-items:center; gap:18px; padding-bottom:20px; border-bottom:2px solid #f1ede3; }
    .brand { color:#f1ede3; font-family:"Grishenko NBP",monospace !important; font-size:clamp(3rem,9vw,5.5rem); font-style:normal; font-weight:400; font-synthesis:none; line-height:.85; text-decoration:none; }
    .back { font-size:.85rem; } .back::before { content:"< "; }
    .prompt { margin:42px 0 38px; font-size:clamp(1.45rem,4vw,2.2rem); line-height:1.25; } .prompt::before { content:"> "; }
    section { margin-top:42px; } h2 { margin:0 0 16px; font-size:1rem; font-weight:normal; } h2::before { content:"[ "; } h2::after { content:" ]"; }
    .editor-grid { display:grid; grid-template-columns:1fr 1fr; gap:48px; }
    form { display:grid; gap:10px; padding-top:15px; border-top:1px solid #f1ede3; } label { font-size:.84rem; }
    input,textarea { width:100%; border:1px solid #f1ede3; border-radius:0; padding:9px; color:#f1ede3; background:#161514; font:inherit; font-size:.9rem; }
    textarea { min-height:125px; resize:vertical; } input:focus,textarea:focus { outline:2px solid #f1ede3; outline-offset:2px; } input[type="file"] { padding:7px; }
    button.primary { justify-self:start; padding:8px 10px; border:1px solid #f1ede3; border-radius:0; background:#f1ede3; color:#161514; font:inherit; cursor:pointer; }
    button.primary:hover,button.primary:focus { background:#161514; color:#f1ede3; }
    .note { margin:4px 0 0; font-size:.75rem; }
    .project-list,.audio-list { border-top:1px solid #f1ede3; } .project,.audio-item { padding:18px 0; border-bottom:1px solid #f1ede3; }
    .project-meta { margin-bottom:8px; font-size:.8rem; } .project h3 { margin:0 0 8px; font-size:1rem; font-weight:normal; } .project h3::before { content:"$ cat "; } .project p { margin:0; white-space:pre-wrap; }
    .delete { display:block; margin-top:12px; padding:0; border:0; background:transparent; text-decoration:underline; font:inherit; font-size:.78rem; cursor:pointer; }
    .audio-item strong { display:block; margin-bottom:10px; font-weight:normal; } .audio-item strong::before { content:"> "; } audio { width:min(100%,450px); filter:grayscale(1) contrast(1.25) invert(1); }
    .empty { padding:18px 0; border-bottom:1px solid #f1ede3; } .empty::before { content:"$ "; }
    footer { margin-top:56px; padding-top:16px; border-top:2px solid #f1ede3; font-size:.8rem; }
    @media (max-width:640px) { body { padding:22px 18px 44px; } .prompt { margin:32px 0; } .editor-grid { grid-template-columns:1fr; gap:38px; } }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="index.html">P.T.B. Horn</a>
    <a class="back" href="index.html">RETURN TO PUBLIC SITE</a>
  </header>
  <main>
    <p class="prompt">PTB HORN / PRIVATE EDITOR</p>
    <section aria-labelledby="add-title">
      <h2 id="add-title">ADD CONTENT</h2>
      <div class="editor-grid">
        <div>
          <form id="project-form">
            <label for="project-title">PROJECT TITLE</label>
            <input id="project-title" required maxlength="100" placeholder="UNTITLED PROJECT">
            <label for="project-body">PROJECT DESCRIPTION</label>
            <textarea id="project-body" required maxlength="3000" placeholder="TYPE PROJECT DETAILS HERE..."></textarea>
            <button class="primary" type="submit">PUBLISH PROJECT</button>
          </form>
        </div>
        <div>
          <form id="audio-form">
            <label for="audio-title">FILE TITLE (OPTIONAL)</label>
            <input id="audio-title" maxlength="100" placeholder="USE FILE NAME">
            <label for="audio-file">SELECT AUDIO FILE</label>
            <input id="audio-file" type="file" accept="audio/*" required>
            <button class="primary" type="submit">LOAD FILE</button>
            <p class="note">FILES ARE AVAILABLE FOR THIS BROWSER VISIT ONLY.</p>
          </form>
        </div>
      </div>
    </section>
    <section aria-labelledby="manage-projects">
      <h2 id="manage-projects">MANAGE PROJECTS</h2>
      <div class="project-list" id="project-list"></div>
    </section>
    <section aria-labelledby="loaded-files">
      <h2 id="loaded-files">LOADED FILES</h2>
      <div class="audio-list" id="audio-list"></div>
      <p class="empty" id="audio-empty">NO FILES LOADED</p>
    </section>
  </main>
  <footer>PTB HORN // PRIVATE EDITOR</footer>
  <script>
    const projectList=document.querySelector('#project-list');
    const audioList=document.querySelector('#audio-list');
    const audioEmpty=document.querySelector('#audio-empty');
    const savedProjects=JSON.parse(localStorage.getItem('ptb-horn-posts')||'[]');
    const projects=Array.isArray(savedProjects)?savedProjects:[];
    const tracks=[];
    const dateLabel=value=>new Intl.DateTimeFormat('en',{day:'2-digit',month:'2-digit',year:'numeric'}).format(new Date(value));
    function renderProjects(){
      projectList.replaceChildren();
      if(!projects.length){const empty=document.createElement('p');empty.className='empty';empty.textContent='NO PROJECTS PUBLISHED';projectList.append(empty);return;}
      projects.forEach((project,index)=>{
        const article=document.createElement('article'),meta=document.createElement('div'),title=document.createElement('h3'),body=document.createElement('p'),remove=document.createElement('button');
        article.className='project';meta.className='project-meta';meta.textContent=`PROJECT // ${dateLabel(project.createdAt)}`;title.textContent=project.title;body.textContent=project.body;remove.className='delete';remove.textContent='DELETE PROJECT';
        remove.addEventListener('click',()=>{projects.splice(index,1);localStorage.setItem('ptb-horn-posts',JSON.stringify(projects));renderProjects();});
        article.append(meta,title,body,remove);projectList.append(article);
      });
    }
    function renderTracks(){
      audioList.replaceChildren();audioEmpty.hidden=tracks.length>0;
      tracks.forEach((track,index)=>{
        const item=document.createElement('div'),title=document.createElement('strong'),player=document.createElement('audio'),remove=document.createElement('button');
        item.className='audio-item';title.textContent=track.title;player.controls=true;player.src=track.url;remove.className='delete';remove.textContent='UNLOAD FILE';
        remove.addEventListener('click',()=>{URL.revokeObjectURL(track.url);tracks.splice(index,1);renderTracks();});
        item.append(title,player,remove);audioList.append(item);
      });
    }
    document.querySelector('#project-form').addEventListener('submit',event=>{
      event.preventDefault();const title=document.querySelector('#project-title'),body=document.querySelector('#project-body');
      projects.unshift({title:title.value.trim(),body:body.value.trim(),createdAt:Date.now()});
      localStorage.setItem('ptb-horn-posts',JSON.stringify(projects));event.currentTarget.reset();renderProjects();
    });
    document.querySelector('#audio-form').addEventListener('submit',event=>{
      event.preventDefault();const file=document.querySelector('#audio-file').files[0],title=document.querySelector('#audio-title').value.trim()||file.name.replace(/\.[^/.]+$/,'');
      tracks.unshift({title,url:URL.createObjectURL(file)});event.currentTarget.reset();renderTracks();
    });
    renderProjects();renderTracks();
  </script>
</body>
</html>
