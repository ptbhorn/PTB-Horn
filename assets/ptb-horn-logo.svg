<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600" role="img" aria-labelledby="title desc">
  <title id="title">PTB Horn</title>
  <desc id="desc">PTB Horn wordmark in VCR OSD Mono with a simple rounded outline and transparent background.</desc>
  <style>
    @font-face {
      font-family: 'VCR OSD Mono';
      src: url('fonts/VCR_OSD_MONO_1.001.ttf') format('truetype');
    }
    .outline { fill: none; stroke: #111827; stroke-width: 18; }
    .wordmark { fill: #111827; font-family: 'VCR OSD Mono', monospace; text-anchor: middle; letter-spacing: 8px; }
  </style>
  <rect class="outline" x="28" y="28" width="1544" height="544" rx="68" />
  <text class="wordmark" x="800" y="290" font-size="222">P.T.B.</text>
  <text class="wordmark" x="800" y="475" font-size="132">HORN</text>
</svg>
